name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        default: staging

# Never run two deployments of the same environment concurrently, and never
# cancel one mid-flight: a killed job can leave migrations half-applied.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  # Required for OIDC federation to the cloud provider — see `deploy-staging`.
  id-token: write

env:
  REGISTRY: ghcr.io
  NODE_VERSION: '22'

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        # The commit SHA, never `latest`: every environment must be able to say
        # exactly which build it is running, and roll back to a specific one.
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the API image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/api:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push the web image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/web:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy-staging:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}

    steps:
      - uses: actions/checkout@v4

      # Prefer OIDC federation over long-lived cloud keys stored as repository
      # secrets: a leaked static key is valid until someone notices, whereas a
      # federated token is scoped to this workflow run.
      #
      # - uses: aws-actions/configure-aws-credentials@v4
      #   with:
      #     role-to-assume: ${{ vars.STAGING_DEPLOY_ROLE_ARN }}
      #     aws-region: ${{ vars.AWS_REGION }}

      - name: Apply database migrations
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          cd backend
          npm install --no-save prisma@6.19.3 @prisma/client@6.19.3
          # `migrate deploy` applies pending migrations only. It never
          # generates, never resets and never prompts — the only Prisma command
          # that belongs in a non-development environment.
          npx prisma migrate deploy

      - name: Deploy
        run: |
          echo "Deploying ${{ needs.build.outputs.image-tag }} to staging"
          # Replace with the platform's deploy command, e.g.
          #   aws ecs update-service --force-new-deployment ...
          #   flyctl deploy --image ...

      - name: Smoke test
        run: |
          for _ in $(seq 1 30); do
            curl -sf "${{ vars.STAGING_API_URL }}/api/v1/health/ready" && exit 0
            sleep 5
          done
          echo "::error::Staging did not become ready"
          exit 1

  deploy-production:
    needs: [build, deploy-staging]
    runs-on: ubuntu-latest
    # A GitHub environment with required reviewers turns this into a manual
    # approval gate. Staging must be green before the button even appears.
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Apply database migrations
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          cd backend
          npm install --no-save prisma@6.19.3 @prisma/client@6.19.3
          npx prisma migrate deploy

      - name: Deploy
        run: echo "Deploying ${{ needs.build.outputs.image-tag }} to production"

      - name: Health check
        run: |
          for _ in $(seq 1 30); do
            curl -sf "${{ vars.PRODUCTION_API_URL }}/api/v1/health/ready" && exit 0
            sleep 5
          done
          echo "::error::Production did not become ready — roll back"
          exit 1
